[package]
name = "tanuki"
version = "0.1.67"
edition = "2021"
build = "build.rs"
description = "terminal workspace manager for AI coding agents"
license = "Apache-2.0"
repository = "https://github.com/BabylenMagnus/tanuki"
keywords = ["terminal", "tui", "ai", "agents", "multiplexer"]
categories = ["command-line-utilities"]
include = [
    "src/**/*",
    "assets/sounds/*",
    "docs/next/api/tanuki-api.schema.json",
    "README.md",
    "LICENSE",
    "Cargo.toml",
]

[dependencies]
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
bytes = "1"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage"] }
clap_complete = "4.5"
crossterm = "0.29"
ctrlc = "3"
interprocess = "2.4.2"
libc = "0.2"
portable-pty = "=0.9.0"
png = "0.17"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
schemars = { version = "1.2.1", features = ["derive"] }
rust_socketio = "0.6"
rust-i18n = "4"
# Tokio-native P2P data channel for the `--cloud` transport (Task 5,
# spelflow-tanuki-terminal-stability-tasks.md). Pinned to the 0.17.x line
# deliberately -- 0.20.0-rc.1 is a Sans-IO rewrite still in development and
# not stable enough to depend on. Exact-pinned to 0.17.2, not 0.17.0:
# 0.17.0 fails to build against its own transitive sub-crates
# (webrtc-sctp 0.17.2 added a non-additive field to a public struct;
# webrtc 0.17.0's own Cargo.toml doesn't exclude it, an upstream semver
# violation). 0.17.2 is the release that matches its own sub-crates.
webrtc = "=0.17.2"
# rust_socketio pulls in native-tls unconditionally (no rustls option). On Linux/musl
# targets native-tls links the system OpenSSL via pkg-config, which isn't available
# (or isn't musl-compatible) on CI/cross-compile runners. Forcing the `vendored`
# feature here (Cargo unifies features per-dependency across the whole build graph)
# makes native-tls build and statically link its own OpenSSL from source instead —
# not directly used by our own code, this entry exists purely for that feature push.
native-tls = { version = "0.2.11", features = ["vendored"] }

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Native Windows self-update (tanuki update, src/platform/windows_install.rs):
# junction creates/reads/deletes NTFS directory junctions for the
# versioned-release-dir layout without hand-rolling FSCTL_SET_REPARSE_POINT.
junction = "1.2.0"
# winreg is already resolved transitively (via vendor/portable-pty's Windows
# deps); promoted to a direct dependency to read/write HKCU\Environment\Path.
winreg = "0.10.1"

